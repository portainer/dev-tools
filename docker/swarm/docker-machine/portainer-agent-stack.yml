version: '3.2'

services:
  agent:
    image: portainer/agent:2.20.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - ~/agent_tmp:/tmp
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainerci/portainer-ce:pr11728
    command: -H tcp://tasks.agent:9001 --tlsskipverify --log-level=DEBUG
    environment:
      UPGRADE_SKIP_PULL_PORTAINER_IMAGE: "true"
    ports:
      - "9443:9443"
      - "9000:9000"
      - "8000:8000"
    volumes:
      - portainer_data:/data
      - ~/portainer_tmp:/tmp
    networks:
      - agent_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  agent_network:
    driver: overlay
    attachable: true

volumes:
  portainer_data: